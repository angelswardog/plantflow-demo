<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PlantFlow V9.1 Loading…</title><style>body{margin:0;background:#0e1319;color:#edf3f7;font:16px system-ui,-apple-system,sans-serif;display:grid;place-items:center;min-height:100vh}.card{max-width:520px;margin:20px;padding:24px;border:1px solid #354452;border-radius:16px;background:#171e27}.muted{color:#9cafbc}button{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid #68b3ff;background:#68b3ff;color:#07111a}</style></head><body><div class="card"><h2>PlantFlow Production Manager</h2><p id="status" class="muted">Loading V9.1 Full Master Test…</p></div><script>(async()=>{const status=document.getElementById('status');try{if(typeof DecompressionStream==='undefined')throw new Error('This browser does not support the required decompression API. Update Safari and reload.');const paths=['payload/c1.txt','payload/c2.txt','payload/c3.txt','payload/c4.txt'];const parts=await Promise.all(paths.map(async p=>{const r=await fetch(p+'?v=91',{cache:'no-store'});if(!r.ok)throw new Error('Could not load '+p+' ('+r.status+')');return(await r.text()).trim()}));const b64=parts.join('');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();if(!html.includes('V9.1 Full Master Test'))throw new Error('PlantFlow payload verification failed.');document.open();document.write(html);document.close()}catch(e){console.error(e);status.innerHTML='PlantFlow could not load.<br><br>'+String(e.message||e)+'<br><br><button onclick="location.reload()">Retry</button>'}})();</script></body></html>
